# SwiftLint runs as a build tool plugin on MovieScopeCore and MovieScope
# (SimplyDanny/SwiftLintPlugins). Test targets are not linted.

included:
  - MovieScopeCore
  - MovieScope
  - SharedIdentifiers

excluded:
  - DerivedData
  - build
  - Artifacts

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - sorted_imports
  - vertical_whitespace_closing_braces

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 600

cyclomatic_complexity:
  warning: 10
  error: 15

function_parameter_count:
  warning: 5
  error: 7

identifier_name:
  excluded:
    - id
    - x
    - y
    - tv

custom_rules:
  no_print_in_core:
    name: "No print in Core"
    included: "MovieScopeCore/.*\\.swift"
    regex: "\\bprint\\("
    message: "Use Log (os.Logger) in MovieScopeCore."
    severity: error
